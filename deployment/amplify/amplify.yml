version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
            - pnpm env:verify
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - pnpm-store/**/*
    environment:
      variables:
        NEXT_TELEMETRY_DISABLED: '1'
        NODE_VERSION: '20'
